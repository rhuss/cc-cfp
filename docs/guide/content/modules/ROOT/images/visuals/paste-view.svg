<text y="64.35"><tspan x="12"># Paste view: kubecon-eu-2027--safe-node-drains</tspan></text>
<text y="102.35"><tspan x="12">Event: KubeCon + CloudNativeCon Europe 2027 (kubecon-eu-2027) | Session type: session | Status: draft</tspan></text>
<text y="140.35"><tspan x="12">Warning: Some limits are approximate (unverified): the live form may differ. Confirm them with screenshots via /cfp:prof</tspan></text>
<text y="159.35"><tspan x="12">ile refresh.</tspan></text>
<text y="178.35"><tspan x="12">Warning: Fields over their limit: title</tspan></text>
<text y="197.35"><tspan x="12">Warning: Required fields not drafted: audience_level, track, format, case_study, previously_presented, cncf_oss_projects</tspan></text>
<text y="235.35"><tspan x="12">## 1. Session Title (title, public, required)</tspan></text>
<text y="273.35"><tspan x="12">84/75 chars (limit approximate, unverified) [OVER LIMIT, limit unverified]</tspan></text>
<text y="311.35"><tspan x="12">Drain Nodes Without Dropping Requests: PodDisruptionBudgets That Hold Under Pressure</tspan></text>
<text y="349.35"><tspan x="12">## 2. Description (abstract, public, required)</tspan></text>
<text y="387.35"><tspan x="12">541/1000 chars</tspan></text>
<text y="425.35"><tspan x="12">Node upgrades should be routine, yet many clusters still drop requests every time a node drains. PodDisruptionBudgets lo</tspan></text>
<text y="444.35"><tspan x="12">ok simple, but readiness gaps, slow endpoint updates, and budgets that block eviction forever turn each maintenance wind</tspan></text>
<text y="463.35"><tspan x="12">ow into an incident. This session walks through a drain from the first cordon to the last eviction and shows where traff</tspan></text>
<text y="482.35"><tspan x="12">ic gets lost. Attendees learn how to size budgets for real replica counts, how to pair them with preStop hooks and readi</tspan></text>
<text y="501.35"><tspan x="12">ness probes, and how to test a drain before the next upgrade.</tspan></text>
<text y="539.35"><tspan x="12">## 3. Value to the community (value_to_community, reviewer-only, required)</tspan></text>
<text y="577.35"><tspan x="12">295 chars (no limit)</tspan></text>
<text y="615.35"><tspan x="12">Every cluster operator drains nodes, and managed platforms now upgrade nodes on a fixed schedule, so the window for manu</tspan></text>
<text y="634.35"><tspan x="12">al babysitting is gone. Platform teams and application owners both benefit: the talk gives them a shared checklist for b</tspan></text>
<text y="653.35"><tspan x="12">udgets and probes that works on any conformant cluster.</tspan></text>
