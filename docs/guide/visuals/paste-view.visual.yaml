  ## 1. Session Title (title, public, required)

  84/75 chars (limit approximate, unverified) [OVER LIMIT, limit unverified]

  Drain Nodes Without Dropping Requests: PodDisruptionBudgets That Hold Under Pressure

  ## 2. Description (abstract, public, required)

  541/1000 chars

  Node upgrades should be routine, yet many clusters still drop requests every time a node drains. PodDisruptionBudgets lo
  ok simple, but readiness gaps, slow endpoint updates, and budgets that block eviction forever turn each maintenance wind
  ow into an incident. This session walks through a drain from the first cordon to the last eviction and shows where traff
  ic gets lost. Attendees learn how to size budgets for real replica counts, how to pair them with preStop hooks and readi
  ness probes, and how to test a drain before the next upgrade.

  ## 3. Value to the community (value_to_community, reviewer-only, required)

  295 chars (no limit)

  Every cluster operator drains nodes, and managed platforms now upgrade nodes on a fixed schedule, so the window for manu
  al babysitting is gone. Platform teams and application owners both benefit: the talk gives them a shared checklist for b
  udgets and probes that works on any conformant cluster.
