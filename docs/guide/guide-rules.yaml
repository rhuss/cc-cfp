rules:
  - glob: "content/modules/ROOT/pages/**/*.adoc"
    forbid:
      - '(?i)red hat summit|rh-summit|rainfocus'
      - '(?i)openshell'
      - '^// cfp:(specs|brainstorm)/'
      - '(?i)\bcfp (submits|will submit|can submit)\b'
  - glob: "content/modules/ROOT/pages/index.adoc"
    require:
      - 'include::(ROOT:)?partial\$baseline-note\.adoc\[\]'
      - 'xref:user/index\.adoc'
      - 'xref:overview/install\.adoc'
      - 'xref:profiles/index\.adoc'
      - 'xref:user/draft\.adoc'
      - 'image::architecture\.svg\['
      - '\{cfp-version\}'
      - '^// url:https://code\.claude\.com/docs/en/overview'
      - '(?i)paste'
    forbid:
      - 'cfp_store\.py'
      - '--from-json'
      - '(?i)front matter'
    require_order:
      - '^== What you get'
      - '^== The parts'
      - '^== How they work together'
      - '^== Ways to start'
      - '^== Status and limits'
      - '^== Where to go next'
  - glob: "content/modules/ROOT/pages/overview/install.adoc"
    require:
      - '^Check:'
      - '// expect:'
      - 'make install'
      - '/cfp:init'
      - 'CFP_STORE'
      - 'Python 3\.10'
      - 'xref:profiles/refresh\.adoc'
      - 'xref:user/draft\.adoc'
    require_order:
      - 'git clone'
      - 'make install'
      - '/cfp:init'
  - glob: "content/modules/ROOT/pages/user/index.adoc"
    require:
      - 'image::store-model\.svg\['
      - 'xref:user/draft\.adoc'
      - 'xref:user/review\.adoc'
      - 'xref:user/preflight\.adoc'
      - 'xref:user/bios\.adoc'
      - 'xref:user/status\.adoc'
    forbid:
      - 'cfp_store\.py'
  - glob: "content/modules/ROOT/pages/user/draft.adoc"
    require:
      - 'image::draft-workflow\.svg\['
      - '/cfp:draft'
      - '--proposal'
      - '--from'
      - 'kubecon-eu-2027'
      - '(?i)closed|deadline has passed'
      - 'relevance_field|relevance field'
      - 'xref:user/review\.adoc'
      - 'xref:user/preflight\.adoc'
      - 'xref:profiles/refresh\.adoc'
  - glob: "content/modules/ROOT/pages/user/review.adoc"
    require:
      - 'cfp:committee-review'
      - '(?i)advisory'
      - '(?i)packet'
      - '(?i)voice pass'
      - 'prose:humanizer'
      - 'prose plugin not installed'
      - '^// url:https://code\.claude\.com/docs/en/sub-agents'
    forbid:
      - '(?i)\bpredicts?\b'
  - glob: "content/modules/ROOT/pages/user/preflight.adoc"
    require:
      - '/cfp:check'
      - '^// visual:paste-view'
      - 'image::visuals/paste-view\.svg\['
      - '(?i)custom'
      - 'bio_on_form|no speaker bio|form has no bio'
      - '(?i)paste'
      - '/cfp:status set'
      - 'xref:user/status\.adoc'
  - glob: "content/modules/ROOT/pages/user/bios.adoc"
    require:
      - '/cfp:bio'
      - 'resource add'
      - '(?i)snapshot'
      - '(?i)third person'
      - '(?i)recording'
  - glob: "content/modules/ROOT/pages/user/status.adoc"
    require:
      - 'image::proposal-lifecycle\.svg\['
      - '/cfp:status'
      - 'reopen'
      - '--date'
      - 'draft'
      - 'ready'
      - 'submitted'
      - 'accepted'
      - 'presented'
      - 'rejected'
      - 'withdrawn'
  - glob: "content/modules/ROOT/pages/profiles/index.adoc"
    require:
      - 'xref:profiles/kubecon\.adoc'
      - 'xref:profiles/new\.adoc'
      - 'xref:profiles/refresh\.adoc'
      - 'xref:profiles/second-conference\.adoc'
      - '/cfp:profile list'
      - '/cfp:profile show'
      - 'unverified'
      - 'screenshot'
      - 'bio_on_form'
      - 'relevance_field'
  - glob: "content/modules/ROOT/pages/profiles/kubecon.adoc"
    require:
      - 'seed_version'
      - 'value_to_community'
      - 'cncf_oss_projects'
      - 'Sessionize'
      - '/cfp:profile refresh kubecon'
      - 'kubecon-eu-2027'
      - 'kubecon-na-2026'
      - 'xref:profiles/refresh\.adoc'
    forbid:
      - '\b1300\b'
  - glob: "content/modules/ROOT/pages/profiles/new.adoc"
    require:
      - '/cfp:profile new'
      - '--screenshots'
      - '(?i)login'
      - 'custom'
      - 'bio_on_form'
      - '^Check:'
      - '/cfp:profile show'
  - glob: "content/modules/ROOT/pages/profiles/refresh.adoc"
    require:
      - '/cfp:profile refresh'
      - '/cfp:init'
      - 'seed_version'
      - 'outdated'
      - '(?i)approval'
      - 'update everything shown'
      - 'profile only'
      - '--screenshots'
  - glob: "content/modules/ROOT/pages/profiles/second-conference.adoc"
    require:
      - '(?i)fictional'
      - 'custom'
      - 'bio_on_form: false'
      - 'audience_level'
      - 'disqualify'
      - 'relevance_field'
      - 'xref:profiles/new\.adoc'
      - 'xref:user/preflight\.adoc'
  - glob: "content/modules/ROOT/pages/internals/architecture.adoc"
    require:
      - 'image::architecture\.svg\['
      - 'UserPromptSubmit'
      - 'cfp-context'
      - 'cfp_store\.py'
      - 'make test'
      - '^// url:https://code\.claude\.com/docs/en/hooks'
      - 'xref:reference/cli\.adoc'
  - glob: "content/modules/ROOT/pages/internals/store.adoc"
    require:
      - 'image::store-model\.svg\['
      - 'config\.md'
      - 'Field: '
      - '(?i)front matter'
      - 'proposals/'
      - 'xref:reference/schema\.adoc'
  - glob: "content/modules/ROOT/pages/internals/rules.adoc"
    require:
      - 'submission_limit'
      - 'repeat_within_months'
      - 'track_in_event'
      - 'speaker_count'
      - 'all_men_panel'
      - 'multi_company_panel'
      - 'vendor_pitch'
      - 'custom'
      - 'pass_average'
      - 'pass_min_criterion'
